server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    location /ws {
        proxy_pass https://api.singularity-resume.ru/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.singularity-resume.ru;
        proxy_set_header Origin https://api.singularity-resume.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Проксирование API запросов (ВАЖНО: должно быть ПЕРЕД location /)
    location /api/ {
        # proxy_pass с завершающим слешем автоматически удаляет /api/ из пути
        proxy_pass https://api.singularity-resume.ru/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host api.singularity-resume.ru;
        # Браузер шлёт Origin фронта (test2-www…); бэкенд его не принимает — подменяем как у Vite changeOrigin
        proxy_set_header Origin https://api.singularity-resume.ru;
        proxy_set_header Referer https://api.singularity-resume.ru/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cookies с api.* должны сохраняться на домене фронта
        proxy_cookie_path / /;
        proxy_cookie_domain api.singularity-resume.ru $host;
        proxy_set_header Cookie $http_cookie;

        # Ответ same-origin для браузера — CORS-заголовки бэкенда не нужны
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Статические файлы с кешированием
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - все запросы на index.html (должно быть ПОСЛЕ location /api/)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Безопасность
    add_header Permissions-Policy "unload=(self)" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

