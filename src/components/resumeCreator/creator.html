<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сингулярити Резюме — Оформление карточки</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #131313;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ============================================================
           ШАПКА САЙТА (header)
           ============================================================ */
        .site-header {
            width: 100%;
            background-color: #202020;
        }

        .header-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #ffffff;
        }

        .logo-shape {
            width: 42px;
            height: 22px;
            background: linear-gradient(90deg, #E95A57 0%, #E53BCF 50%, #3E8EFF 100%);
            clip-path: polygon(0 25%, 85% 0, 100% 25%, 30% 100%, 30% 65%, 0 65%);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            line-height: 1.2;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .nav-capsule {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link {
            color: #b3b3b7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            padding: 8px 20px;
            border-radius: 100px;
            transition: color 0.2s ease, background-color 0.2s ease;
            white-space: nowrap;
        }

        .nav-link:hover:not(.active):not(.disabled) {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            font-weight: 600;
            background: linear-gradient(90deg, #E95A57 0%, #E53BCF 50%, #3E8EFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        .nav-link.disabled {
            color: #4a4a4e;
            cursor: not-allowed;
        }

        .actions-container {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .chat-button {
            background: none;
            border: none;
            color: #b3b3b7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .chat-button:hover {
            color: #ffffff;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(180deg, #2c2c2e 0%, #3a3a3c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .user-avatar svg {
            width: 20px;
            height: 20px;
            fill: #d1d1d6;
        }

        /* ============================================================
           ОБЛАСТЬ ФОРМЫ (карточка)
           ============================================================ */
        .page-content {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card-creator {
            width: 100%;
            max-width: 1100px;
            background-color: #202123;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .creator-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        /* ЛЕВАЯ КОЛОНКА */
        .form-section h2 {
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 24px;
            opacity: 0.9;
        }

        .input-group-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field label {
            font-size: 12px;
            color: #8e8e93;
        }

        .input-field input,
        .input-field select {
            background-color: transparent;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            width: 100%;
            font-family: inherit;
        }

        .input-field input::placeholder {
            color: #555558;
        }

        .course-selector {
            margin-bottom: 24px;
        }

        .course-selector p,
        .gender-selector p {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 8px;
        }

        .course-buttons {
            display: flex;
            gap: 8px;
        }

        .course-btn {
            background-color: transparent;
            border: 1px solid #3a3a3c;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            flex: 1;
            text-align: center;
            transition: all 0.2s ease;
        }

        .course-btn.active {
            background-color: #3a3a3c;
        }

        .course-btn svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
            vertical-align: middle;
        }

        .gender-buttons {
            display: flex;
            background-color: transparent;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }

        .gender-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8e8e93;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .gender-btn.active {
            background-color: #3a3a3c;
            color: #ffffff; 
        }

        /* ПРАВАЯ КОЛОНКА */
        .preview-section {
            background-color: #191A1B;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: #555558;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-icon {
            width: 14px;
            height: 14px;
            background-color: #3a3a3c;
            color: #8e8e93;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: help;
        }

        .student-card {
            background-color: #202020;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            width: 190px;
            padding: 14px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .avatar-placeholder {
            width: 100%;
            height: 160px;
            background: linear-gradient(180deg, #444a65 0%, #29314c 100%);
            border-radius: 12px;
            position: relative;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .badge-container {
            position: absolute;
            left: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .badge-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-py { background-color: #fff; }
        .badge-course { background-color: #007bff; color: #fff; }

        .student-name {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .student-spec {
            font-size: 11px;
            color: #8e8e93;
        }

        .preview-legends {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #8e8e93;
        }

        .legend-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .bg-blue { background-color: #00bcd4; color: #000; }
        .bg-white { background-color: #ffffff; color: #000; }

        /* НИЖНЯЯ ЧАСТЬ */
        .footer-section {
            margin-top: 20px;
        }

        .progress-timeline {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
        }

        .progress-step {
            height: 4px;
            flex: 1;
            background-color: #2c2c2e;
            border-radius: 2px;
        }

        .progress-step.active {
            background-color: #007bff;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-info h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .step-info p {
            font-size: 12px;
            color: #007bff;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-save {
            background: none;
            border: 1px solid #007bff;
            color: #007bff;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: background 0.2s ease;
        }

        .btn-save:hover {
            background: rgba(0, 123, 255, 0.1);
        }

        .btn-nav {
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-back {
            background-color: #3a3a3c;
            color: #8e8e93;
        }

        .btn-next {
            background-color: #ffffff;
            color: #000000;
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 860px) {
            .creator-grid {
                grid-template-columns: 1fr;
            }
            .control-bar {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 820px) {
            .header-container {
                padding: 12px 16px;
            }
            .logo-text {
                display: none;
            }
            .nav-link {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ================= ШАПКА ================= -->
    <header class="site-header">
        <div class="header-container">
            <a href="#" class="logo-container">
                <div class="logo-shape"></div>
                <div class="logo-text">
                    <span>сингулярити</span>
                    <span>резюме</span>
                </div>
            </a>

            <nav class="nav-capsule">
                <a href="#" class="nav-link active">Центр карьеры</a>
                <a href="#" class="nav-link">Проекты</a>
                <a href="#" class="nav-link">Резюме</a>
                <a href="#" class="nav-link disabled">Вакансии</a>
            </nav>

            <div class="actions-container">
                <button class="chat-button" aria-label="Сообщения">
                    <svg width="22" height="20" viewBox="0 0 22 20" fill="none" xmlns="http://w3.org">
                        <path d="M19 0H3C1.35 0 0 1.35 0 3V13C0 14.65 1.35 16 3 16H16L21.3 19.53C21.5 19.67 21.75 19.7 21.95 19.6C22.15 19.5 22.25 19.3 22.25 19.07V3C22 1.35 20.65 0 19 0ZM19 14H15.17L12 16.12L3 14V3H19V14Z" fill="currentColor"/>
                    </svg>
                </button>

                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- ================= ФОРМА ================= -->
    <div class="page-content">
        <main class="card-creator">
            <div class="creator-grid">

                <!-- ЛЕВАЯ СЕКЦИЯ: Поля ввода -->
                <section class="form-section">
                    <h2>Основные данные</h2>

                    <div class="input-group-row">
                        <div class="input-field">
                            <label>Имя</label>
                            <input type="text" placeholder="Введите имя">
                        </div>
                        <div class="input-field">
                            <label>Фамилия</label>
                            <input type="text" placeholder="Введите фамилию">
                        </div>
                    </div>

                    <div class="input-group-row">
                        <div class="input-field">
                            <label>Город</label>
                            <input type="text" value="г. Москва">
                        </div>
                        <div class="input-field">
                            <label>Дата рождения</label>
                            <input type="text" placeholder="дд.мм.гггг">
                        </div>
                    </div>

                    <div class="course-selector">
                        <p>Номер курса</p>
                        <div class="course-buttons">
                            <button class="course-btn active">1</button>
                            <button class="course-btn">2</button>
                            <button class="course-btn">3</button>
                            <button class="course-btn">4</button>
                        </div>
                    </div>

                    <div class="gender-selector">
                        <p>Пол</p>
                        <div class="gender-buttons">
                            <button class="gender-btn active">Мужской</button>
                            <button class="gender-btn">Женский</button>
                        </div>
                    </div>
                </section>

                <!-- ПРАВАЯ СЕКЦИЯ: Предпросмотр -->
                <section class="preview-section">
                    <div class="preview-title">
                        Оформление карточки
                        <span class="info-icon">?</span>
                    </div>

                    <div class="student-card">
                        <div class="avatar-placeholder">
                            <div class="badge-container">
                                <div class="badge-icon badge-py">PY</div>
                                <div class="badge-icon badge-course">1</div>
                            </div>
                        </div>
                        <div class="student-name">Имя Фамилия</div>
                        <div class="student-spec">Специализация</div>
                    </div>

                    <div class="preview-legends">
                        <div class="legend-item">
                            <span class="legend-badge bg-blue">1</span>
                            Курс
                        </div>
                        <div class="legend-item">
                            <span class="legend-badge bg-white">PY</span>
                            Python
                        </div>
                    </div>
                </section>
            </div>

            <!-- НИЖНЯЯ ЧАСТЬ -->
            <div class="footer-section">
                <div class="progress-timeline">
                    <div class="progress-step active"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                </div>

                <div class="control-bar">
                    <div class="step-info">
                        <h3>Шаг 1 из 8</h3>
                        <p>Сохранить прогресс</p>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-nav btn-back">Назад</button>
                        <button class="btn-nav btn-next">Далее</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
